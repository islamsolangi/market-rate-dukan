ent('input');inp.type='file';inp.accept='image/*';inp.capture='environment';inp.onchange=function(){var r=new FileReader();r.onload=function(e){it.img=e.target.result;save();renderAll();};r.readAsDataURL(inp.files[0]);};inp.click();}function toggleOut(id){var s=shops.find(function(x){return x.id==myId;});var it=s.items.find(function(x){return x.id==id;});it.out=!it.out;save();renderAll();}function deleteItem(id){if(!confirm(T.delete[cur]+'?'))return;var s=shops.find(function(x){return x.id==myId;});s.items=s.items.filter(function(x){return x.id!==id;});save();renderAll();}function renderShops(){var q=(document.getElementById('searchShop').value||'').toLowerCase();var list=shops.filter(function(s){return (s.name+s.addr+s.type).toLowerCase().includes(q);});document.getElementById('shopList').innerHTML=list.length?list.map(function(s){return '<div class="card shop"><img src="'+s.img+'"><div style="flex:1"><b>'+s.name+'</b><br>'+s.addr+' - '+s.type+'<br>'+(s.offer?'<span class="badge">'+s.offer+'</span>':'')+'</div><button class="small green" onclick="openShop(\''+s.id+'\')">'+T.open[cur]+'</button></div>';}).join(''):'<p>'+T.no_shop[cur]+'</p>';}function openShop(id){var s=shops.find(function(x){return x.id==id;});var itemsHtml=s.items.map(function(it){return '<div class="item"><img src="'+it.img+'"><div style="flex:1"><b>'+it.name+'</b><br>'+(it.out?T.out[cur]:it.price+' / '+it.unit)+'</div></div>';}).join('');document.getElementById('shopDetail').innerHTML='<div class="card"><img src="'+s.img+'" style="width:100%;height:180px;object-fit:cover;border-radius:12px"><h2>'+s.name+'</h2><p>'+s.addr+'<br>'+s.phone+' - '+s.type+'<br>'+(s.offer?s.offer:'')+'</p><h3>'+T.my_items[cur]+'</h3>'+itemsHtml+'<br><a href="https://wa.me/92'+(s.phone||'').replace(/^0/,'')+'" target="_blank"><button class="btn" style="background:#25D366">'+T.order_wa[cur]+'</button></a></div>';}function renderMy(){var s=shops.find(function(x){return x.id==myId;});document.getElementById('registerBox').classList.toggle('hidden',!!s);document.getElementById('myShopBox').classList.toggle('hidden',!s);if(!s)return;document.getElementById('myShopTitle').innerText=s.name;document.getElementById('myShopMeta').innerText=s.addr+' - '+s.phone+' - '+s.type;document.getElementById('myShopImg').src=s.img;document.getElementById('offerInput').value=s.offer||'';document.getElementById('myItems').innerHTML=s.items.map(function(it){return '<div class="item"><img src="'+it.img+'"><div style="flex:1"><b>'+it.name+'</b><br>'+it.price+' / '+it.unit+' '+(it.out?' - '+T.out[cur]:'')+'</div><div style="display:flex;flex-direction:column;gap:6px"><button class="small orange" onclick="updatePrice(\''+it.id+'\')">'+T.change_price[cur]+'</button><button class="small grey" onclick="editItem(\''+it.id+'\')">'+T.edit[cur]+'</button><button class="small grey" onclick="changeItemPhoto(\''+it.id+'\')">📷 تصوير بدليو</button><button class="small grey" onclick="toggleOut(\''+it.id+'\')">'+(it.out?T.available[cur]:T.out[cur])+'</button><button class="small red" onclick="deleteItem(\''+it.id+'\')">'+T.delete[cur]+'</button></div></div>';}).join('');}function renderAll(){renderShops();renderMy();}applyLang();renderAll();</script></body></html>
